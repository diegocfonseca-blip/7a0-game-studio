<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Torcida e acessos — revisão local</title><style>body{margin:0;background:#F4ECD6;color:#0C0C0C;font:16px system-ui}main{max-width:1100px;margin:auto;padding:16px}button,select{font:inherit;padding:10px;margin:5px;border:2px solid;border-radius:8px;background:#F4ECD6;color:#0C0C0C}output{display:block;overflow-wrap:anywhere}.window{height:400px;overflow:hidden;position:relative}</style><div id="root"></div><script type="module">
