<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisão local da partida e janela</title><style>body{margin:0;background:#f4ecd6;font-family:system-ui}main{max-width:1100px;margin:auto;padding:12px}button{min-height:44px}</style></head><body><main id="root"></main>
<script type="module">
import React from 'react';import{createRoot}from'react-dom/client';
import{usePartidaNoMapa,usePublicarPartida}from'./src/escalacao/presidencia-partida-sincronia.ts';
import{STADIUM_SECTORS,STADIUM_EXTRAS}from'./src/escalacao/estadiodata.ts';
const h=React.createElement,root=createRoot(document.getElementById('root'));
const team=s=>['GOL','LAT','LAT','ZAG','ZAG','MEI','MEI','MEI','ATA','ATA','ATA'].map((pos,i)=>({id:s+i,name:s+i,pos}));
window.qaReviewTeam=team;
function Probe({id}){const state=usePartidaNoMapa(id);window.qaReviewState=state;return h('output',{id:'review-score',hidden:true},JSON.stringify(state,(key,value)=>key==='sequence'&&value?{version:value.version,shotStartMs:value.shotStartMs,durationMs:value.durationMs,boundaries:value.boundaries}:value));}
window.renderReviewScore=async props=>{
 await import('./src/escalacao/screens.tsx');
 const{LiveScoreCard}=await import('./src/escalacao/pyramidseason.tsx');
 root.render(h(React.Fragment,null,h(LiveScoreCard,props),h(Probe,{id:props.stadiumMatch.id})));
};
const full=Object.fromEntries(STADIUM_SECTORS.map(s=>[s.k,s.cost]));
window.qaReviewStages=[
 {name:'varzea',save:{inv:{},ext:[]}},
 {name:'gramado-parcial',save:{inv:{grama:20},ext:[]}},
 {name:'primeiro-andar',save:{inv:{...full,camarote:0},ext:[]}},
 {name:'segundo-parcial',save:{inv:{...full,camarote:60},ext:[]}},
 {name:'cobertura',save:{inv:full,ext:['cober','refl','telao']}},
 {name:'completo-fechado',save:{inv:full,ext:[...STADIUM_EXTRAS.map(s=>s.k),'asfalto'],roofClosed:true}}
];
const president={version:5,name:'Presidente local',outfit:'terno',appearance:{version:22,hair:'classic-hair',beard:'classic-beard',accessories:[],skinTone:'medium'},sinceSeason:1};
function Room({Sala,stadium}){
 const state={careerOnline:true,onlineMode:'cpu',sport:'futebol',youIdx:0,seasonNo:3,managers:[{id:17,isHuman:true}],stadiums:{17:stadium},careerCoins:{17:321},careerPresidency:{17:{revision:1,owned:[{id:'mesa-simples',paid:20},{id:'cadeira-simples',paid:20}]}}};
 usePublicarPartida({context:{id:'room-review',homeClubId:17,home:team('h'),away:team('a')},minute:20,homeScore:0,awayScore:0,paused:true,finished:false,homeColor:'#1b7a3d',awayColor:'#c2452f'});
 return h(Sala,{state,mgrId:17,president});
}
window.renderReviewRoom=async index=>{
 const{SalaIlustrada}=await import('./src/escalacao/presidencia-sala-montagem.tsx');
 window.qaReviewRoomIndex=index;root.render(h(Room,{Sala:SalaIlustrada,stadium:window.qaReviewStages[index].save}));
};
</script></body></html>
