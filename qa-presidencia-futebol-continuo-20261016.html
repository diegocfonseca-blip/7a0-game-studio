<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Futebol contínuo — diagnóstico local</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4ecd6;color:#161912;font-family:system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:8px}h1{font-size:18px;margin:3px 0}p{font-size:12px;margin:5px 0}header{min-height:72px}.tools{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.tools select,.tools button{min-height:36px;background:#fff9e9;border:2px solid #1d2119;border-radius:8px;padding:4px 9px}.stage{position:relative;height:72vh;min-height:460px;max-height:760px;border:3px solid #1d2119;border-radius:14px;overflow:hidden;background:#bbc7c1}.stage canvas{display:block;width:100%;height:100%}.status{position:absolute;bottom:8px;left:8px;right:8px;background:#f4ecd6ed;padding:7px 9px;border:1px solid #2d342b;border-radius:7px;font-size:12px;pointer-events:none}.video .tools{display:none}.video header{min-height:54px}.video .stage{height:calc(100vh - 83px);min-height:360px}
</style></head><body><main><header><h1>Futebol contínuo · diagnóstico local</h1><p>Escalações de teste. Campo, estádio, bola e atletas usam os modelos do jogo. Nenhuma conta ou partida real é alterada.</p></header>
<div class="tools"><select id="stage"><option value="bare">Várzea</option><option value="full">Estádio completo</option></select><select id="play"><option value="assist">Jogada com assistência</option><option value="individual">Jogada individual</option></select><select id="outcome"><option value="goal">Gol</option><option value="fora">Fora</option><option value="isolou">Por cima</option><option value="trave">Trave</option><option value="defendeu">Defesa</option></select><select id="phase"></select><select id="view"><option value="action">Jogada</option><option value="feet">Pé e bola</option><option value="stadium">Estádio</option><option value="goal">Gol</option></select></div>
<div class="stage"><div class="status" id="status">Preparando modelos reais…</div></div><p>Recorte de diagnóstico: torcida e bairro omitidos; piso neutro somente fora do campo. Iluminação diurna.</p></main>
<script type="module">
import * as THREE from 'three';
import {criarPartidaComplexo} from './src/escalacao/presidencia-complexo-partida.ts';
import {criarArquiteturaComplexo} from './src/escalacao/presidencia-complexo-arquitetura.ts';
import {complexoDoEstadio} from './src/escalacao/presidencia-complexo-model.ts';
import {quadroFutebol3D,planejarLanceFutebol} from './src/escalacao/presidencia-futebol-motor.ts';
import {STADIUM_SECTORS,STADIUM_EXTRAS} from './src/escalacao/estadiodata.ts';
const el=document.querySelector('.stage'),status=document.querySelector('#status'),scene=new THREE.Scene();scene.background=new THREE.Color('#bbc7c1');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;el.prepend(renderer.domElement);
// Neutral support outside the real pitch apron, so the diagnostic crop has no
// artificial floating edge. It never replaces any field/stadium geometry.
const supportShape=new THREE.Shape();supportShape.moveTo(-450,-450);supportShape.lineTo(450,-450);supportShape.lineTo(450,450);supportShape.lineTo(-450,450);supportShape.closePath();const pitchHole=new THREE.Path();pitchHole.moveTo(-62.5,-43);pitchHole.lineTo(-62.5,43);pitchHole.lineTo(62.5,43);pitchHole.lineTo(62.5,-43);pitchHole.closePath();supportShape.holes.push(pitchHole);
const support=new THREE.Mesh(new THREE.ShapeGeometry(supportShape),new THREE.MeshStandardMaterial({color:'#8d825c',roughness:1}));support.rotation.x=-Math.PI/2;support.position.y=-.022;support.receiveShadow=true;scene.add(support);
const camera=new THREE.PerspectiveCamera(42,1,.03,1200),sun=new THREE.DirectionalLight('#ffdda5',3.1);scene.add(new THREE.HemisphereLight('#e8f0ed','#655d42',2.1));sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=.5;sun.shadow.camera.far=400;sun.shadow.bias=-.0001;sun.shadow.normalBias=.012;scene.add(sun,sun.target);
const full={inv:Object.fromEntries(STADIUM_SECTORS.map(s=>[s.k,s.cost])),ext:STADIUM_EXTRAS.map(s=>s.k)},bare={inv:{},ext:[]};
const team=side=>['GOL','LAT','LAT','ZAG','ZAG','MEI','MEI','MEI','ATA','ATA','ATA'].map((pos,i)=>({id:side+i,name:`${side==='h'?'Mandante':'Visitante'} ${i+1}`,pos}));
const bench=side=>['GOL','ZAG','LAT','MEI','MEI','ATA','ATA'].map((pos,i)=>({id:side+'b'+i,name:'Reserva '+side+i,pos}));
let architecture,game,base,event,plan,current,frame,stageName,serial=0,elapsed=0,view='action',ready=false,video=false;
let config={stage:'bare',play:'assist',outcome:'goal'},landmarks=[],fixedAction,videoFps=12,videoRate=1;
const now=10000,point=p=>new THREE.Vector3(p.x,p.y??0,p.z),distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);
function render(){if(!game)return;architecture.updateSeats(camera);renderer.render(scene,camera)}
function assets(){const textures=new Set();scene.traverse(o=>{for(const m of Array.isArray(o.material)?o.material:[o.material])if(m)for(const value of Object.values(m))if(value?.isTexture)textures.add(value)});let pending=0;for(const texture of textures){const img=texture.image;if(!img||('complete'in img?!img.complete||img.naturalWidth===0:!(img.width>0&&img.height>0)))pending++}return {textures:textures.size,pending}}
function fit(points,direction,padding=1.16){
 const bounds=new THREE.Box3().setFromPoints(points),center=bounds.getCenter(new THREE.Vector3()),dir=direction.clone().normalize();let low=2,high=650;
 for(let i=0;i<25;i++){const d=(low+high)/2;camera.position.copy(center).addScaledVector(dir,d);camera.lookAt(center);camera.updateMatrixWorld();const fits=points.every(p=>{const q=p.clone().project(camera);return Math.abs(q.x)<1/padding&&Math.abs(q.y)<1/padding&&q.z>-1&&q.z<1});if(fits)high=d;else low=d}
 camera.position.copy(center).addScaledVector(dir,high);camera.lookAt(center);camera.updateMatrixWorld();return center;
}
function poseAt(t){
 const clock={elapsedMs:t,sampledAt:now,rate:1,running:false};
 current={...base,visualClock:{seconds:20+t/1000,sampledAt:now,running:false},[config.outcome==='goal'?'goal':'chance']:{...event,plan,clock,...(config.outcome==='goal'?{phase:t>=plan.durationMs?'confirmed':'shot'}:{})}};
 const before=JSON.stringify(current);game.update(current,now);frame=quadroFutebol3D(current,now);if(JSON.stringify(current)!==before)throw Error('A apresentação alterou a fonte da partida');scene.updateMatrixWorld(true);
}
function activePlayer(){const striking=frame.players.filter(p=>p.kick>.25).sort((a,b)=>Math.hypot(a.mx-frame.ball.x,a.mz-frame.ball.z)-Math.hypot(b.mx-frame.ball.x,b.mz-frame.ball.z))[0],incoming=landmarks.some(l=>l.name==='incoming'&&Math.abs(l.at-elapsed)<.01);const id=incoming?plan.author.key:frame.owner??striking?.key??(elapsed<plan.sequence.shotStartMs&&config.play==='assist'?plan.assist?.key:plan.author.key);return frame.players.find(p=>p.key===id)??frame.players.find(p=>p.key===plan.author.key)}
function cameraFor(next){
 view=next;camera.aspect=el.clientWidth/el.clientHeight;camera.fov=next==='feet'?40:42;camera.near=next==='feet'?.04:next==='follow'?.1:.5;camera.updateProjectionMatrix();let center;
 if(next==='stadium'){
  const max=config.stage==='full'?118:65,deep=config.stage==='full'?100:48,h=config.stage==='full'?27:4;
  center=fit([-max,max].flatMap(x=>[-deep,deep].flatMap(z=>[0,h].map(y=>new THREE.Vector3(x,y,z)))),new THREE.Vector3(.48,.9,1.2));
 }else if(next==='feet'){
  const p=activePlayer(),forward=new THREE.Vector3(Math.sin(p.heading),0,Math.cos(p.heading)),side=new THREE.Vector3(Math.cos(p.heading),0,-Math.sin(p.heading));
  center=new THREE.Vector3(p.mx,.52,p.mz).lerp(point(frame.ball).setY(.52),.28);camera.position.copy(center).addScaledVector(side,-2.8).addScaledVector(forward,1.7);camera.position.y=1.4;camera.lookAt(center);
 }else if(next==='follow'){const p=frame.players.find(p=>p.key===plan.author.key);center=new THREE.Vector3(p.mx,.85,p.mz);camera.position.copy(center).add(new THREE.Vector3(-3.5,2.25,5));camera.lookAt(center)}
 else if(next==='goal')center=fit([new THREE.Vector3(45,0,-7),new THREE.Vector3(55,5,7),point(frame.ball)],new THREE.Vector3(-.8,.5,1.1),1.3);
 else{
  const p=activePlayer(),players=frame.players.filter(p=>p.key===plan.author.key||p.key===plan.assist?.key),points=[point(frame.ball),...players.map(p=>new THREE.Vector3(p.mx,.9,p.mz))];
  if(video&&fixedAction)center=fit(fixedAction,new THREE.Vector3(-.36,.8,1.1),1.2);
  else{for(const p of [...points])points.push(p.clone().add(new THREE.Vector3(-4,0,-3)),p.clone().add(new THREE.Vector3(4,2.4,3)));center=fit(points,new THREE.Vector3(-.45,.65,1.1),1.2)}
 }
 sun.target.position.copy(center);sun.position.copy(center).add(new THREE.Vector3(-65,100,55));const span=next==='feet'||next==='follow'?12:next==='stadium'?260:120;Object.assign(sun.shadow.camera,{left:-span/2,right:span/2,top:span/2,bottom:-span/2});sun.shadow.camera.updateProjectionMatrix();camera.updateMatrixWorld();render();
}
function inspect(){
 const p=activePlayer(),root=scene.getObjectByName(p.key),ball=scene.getObjectByName('match-ball'),boots=[];
 root.traverse(n=>{if(n.isMesh&&n.name==='atleta-chuteira')boots.push(n)});
 let lowest=Infinity,ballToBoot=Infinity;const bootHeights=[];
 for(const boot of boots){let low=Infinity;for(const x of [-.075,.075])for(const y of [-.05,.05])for(const z of [-.14,.14])low=Math.min(low,new THREE.Vector3(x,y,z).applyMatrix4(boot.matrixWorld).y);lowest=Math.min(lowest,low);bootHeights.push(low);
  const q=point(frame.ball).applyMatrix4(boot.matrixWorld.clone().invert()),outside=new THREE.Vector3(Math.max(0,Math.abs(q.x)-.075),Math.max(0,Math.abs(q.y)-.05),Math.max(0,Math.abs(q.z)-.14));ballToBoot=Math.min(ballToBoot,outside.length());}
 const bounds=new THREE.Box3().setFromObject(root),mark=landmarks.find(l=>Math.abs(l.at-elapsed)<.1);
 const vertices=ball.geometry.getAttribute('position');let minRadius=Infinity,maxRadius=0;for(let i=0;i<vertices.count;i++){const r=Math.hypot(vertices.getX(i),vertices.getY(i),vertices.getZ(i));minRadius=Math.min(minRadius,r);maxRadius=Math.max(maxRadius,r)}
 const renderedPlayersMatch=frame.players.every(p=>{const body=scene.getObjectByName(p.key);return body&&Math.hypot(body.position.x-p.mx,body.position.z-p.mz)<1e-9});
 return {config:{...config},view,elapsed,landmark:mark?.name,phase:frame.phase,owner:frame.owner,player:{key:p.key,x:p.mx,z:p.mz,heading:p.heading,speed:p.speed,kick:p.kick,control:p.control,dive:p.dive,footHeights:bootHeights,height:bounds.max.y-bounds.min.y},ball:{...frame.ball,radius:ball.userData.radius??ball.geometry.parameters?.radius,surfaceRadii:[minRadius,maxRadius]},ballToBootSurface:ballToBoot,lowestBoot:lowest,renderMatchesFrame:distance(ball.position,frame.ball)<1e-9,renderedPlayersMatch,players:frame.players.map(p=>({key:p.key,x:p.mx,z:p.mz,heading:p.heading,speed:p.speed,kick:p.kick,control:p.control})),architecture:{...architecture.counts},assets:assets(),canvas:[renderer.domElement.width,renderer.domElement.height],calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,plan:{durationMs:plan.durationMs,shotStartMs:plan.sequence.shotStartMs,bytes:plan.sequence.bytes,boundaries:plan.sequence.boundaries,author:plan.author,assist:plan.assist},landmarks};
}
function seek(t,next=view){elapsed=Math.max(0,Math.min(plan.durationMs+650,t));poseAt(elapsed);cameraFor(next);const mark=landmarks.find(l=>Math.abs(l.at-elapsed)<.1);status.textContent=`${config.stage==='bare'?'Várzea':'Estádio completo'} · ${config.play==='assist'?'Com assistência':'Individual'} · ${mark?.label??frame.phase} · ${(elapsed/1000).toFixed(2)}s / ${(plan.durationMs/1000).toFixed(2)}s${video?` · amostras a ${videoFps} fps, tempo ${videoRate}×`:' · quadro pausado de diagnóstico'}`;return inspect()}
function configure(update={}){
 ready=false;config={...config,...update};const stadium=config.stage==='full'?full:bare;
 if(stageName!==config.stage){game?.dispose();architecture?.dispose();architecture=criarArquiteturaComplexo(scene,complexoDoEstadio(stadium));game=criarPartidaComplexo(scene,stadium,undefined,()=>render());stageName=config.stage}
 base={context:{id:`qa-continuo-${++serial}`,homeClubId:17,home:team('h'),away:team('a'),homeBench:bench('h'),awayBench:bench('a')},minute:20,homeScore:0,awayScore:0,paused:true,finished:false,homeColor:'#1b7a3d',awayColor:'#c2452f',visualClock:{seconds:20,sampledAt:now,running:false}};
 event={id:`qa-${config.play}-${config.outcome}`,home:true,name:'Mandante 11',scorerId:'h10',...(config.play==='assist'?{assistId:'h5',assist:'Mandante 6'}:{}),minute:20,startedAt:now,...(config.outcome==='goal'?{phase:'shot'}:{outcome:config.outcome})};
 plan=planejarLanceFutebol(base,event,now);if(!plan?.sequence)throw Error('O plano contínuo ainda não foi integrado ao motor');
 const find=(kind,last=false)=>{const values=plan.sequence.boundaries.filter(b=>b.kind===kind);return last?values.at(-1):values[0]},inside=(b,q=.5)=>b.startMs+(b.endMs-b.startMs)*q;
 landmarks=[{name:'initial',label:'Início',at:0}];for(const [kind,label] of [['prepare','Preparação'],['receive','Domínio'],['pass','Passe'],['carry','Condução']]){const b=find(kind,kind==='carry'||kind==='receive');if(b)landmarks.push({name:kind,label,at:inside(b,kind==='receive'?.42:.5)})}
 if(find('pass'))landmarks.push({name:'pass-contact',label:'Contato do passe',at:find('pass').startMs});
 if(config.play==='assist'&&find('receive',true))landmarks.push({name:'incoming',label:'Chegada do passe',at:Math.max(0,find('receive',true).startMs-120)});
 landmarks.push({name:'strike',label:'Contato do chute',at:plan.sequence.shotStartMs},{name:'flight',label:'Bola em trajetória',at:plan.sequence.shotStartMs+(plan.durationMs-plan.sequence.shotStartMs)*.55},{name:'impact',label:'Desfecho',at:plan.durationMs});
 const select=document.querySelector('#phase');select.replaceChildren(...landmarks.map(l=>{const o=document.createElement('option');o.value=l.name;o.textContent=l.label;return o}));
 fixedAction=plan.sequence.frames.flatMap((f,i)=>i%8===0||i===plan.sequence.frames.length-1?[point(f.ball),new THREE.Vector3(f.ball.x,2.2,f.ball.z)]:[]);ready=true;return seek(0,'action');
}
function resize(){renderer.setSize(el.clientWidth,el.clientHeight,false);if(ready)cameraFor(view)}new ResizeObserver(resize).observe(el);
window.qaFootball={configure,seek,inspect,assets,ready:()=>ready,phase:(name,next)=>{const l=landmarks.find(l=>l.name===name);if(!l)throw Error('Fase ausente: '+name);return seek(l.at,next)},video:(enabled,options={})=>{video=enabled;videoFps=options.fps??12;videoRate=options.rate??1;if(enabled)fixedAction=plan.sequence.frames.filter(f=>f.atMs>=(options.startMs??0)).flatMap((f,i)=>i%8===0?[point(f.ball),new THREE.Vector3(f.ball.x,2.2,f.ball.z)]:[]);document.body.classList.toggle('video',enabled);resize()},canvas:renderer.domElement};
for(const id of ['stage','play','outcome'])document.querySelector('#'+id).onchange=e=>configure({[id]:e.target.value});document.querySelector('#phase').onchange=e=>window.qaFootball.phase(e.target.value);document.querySelector('#view').onchange=e=>cameraFor(e.target.value);
resize();configure();
window.addEventListener('beforeunload',()=>{game?.dispose();architecture?.dispose();renderer.dispose()});
</script></body></html>
