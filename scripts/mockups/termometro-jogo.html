<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700;900&display=swap" rel="stylesheet">
<style>body{margin:0;background:#1b1b1b;display:flex;justify-content:center;padding:20px;font-family:Arial}
.ph{width:390px;background:#0C0C0C;border:3px solid #333;border-radius:24px;padding:12px;box-sizing:border-box}

.top{display:flex;justify-content:space-between;align-items:center;font:900 11px Oswald;text-transform:uppercase}
.top b{color:#FFC400}
.termo{height:9px;border:2px solid #000;border-radius:99px;overflow:hidden;display:flex;margin-top:5px}
.a{background:#1B7A3D}.b{background:#C2452F}
.cap{color:#fff;font:900 14px Oswald;text-align:center;margin:0 0 8px}
.tac{margin-top:8px;background:#F4ECD6;border:3px solid #000;border-radius:14px;padding:8px;text-align:center;font:800 11px Oswald;color:#555}
</style></head><body><div><p class="cap">ABA DO JOGO · SÓ QUANDO É CLÁSSICO CONTRA AMIGO</p><div class="ph">

</div></div></body></html>
