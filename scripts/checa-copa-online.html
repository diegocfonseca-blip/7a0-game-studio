<!doctype html><meta charset="utf-8"><title>checa copa online</title><div id="root"></div><pre id="out">rodando…</pre>
<script type="module">
const log = []
const p = (s) => { log.push(s); document.getElementById('out').textContent = log.join('\n') }
try {
  // ordem de import IGUAL à do app (o ciclo screens↔pyramidseason↔copa-mundo
  // só resolve nessa ordem; fora dela o dev server estoura na inicialização)
  await import('/src/escalacao/screens.tsx')
  await import('/src/escalacao/pyramidseason.tsx')
  const { simulaCopaMundo, countryPool, bestXI } = await import('/src/escalacao/copa-mundo.tsx')
  const { montaFicha, entrantesDaFicha, paisesDaCopa } = await import('/src/escalacao/copa-mundo-online.tsx')

  const paises = paisesDaCopa()
  p('seleções da Copa: ' + paises.length + ' → ' + paises.slice(0, 6).join(' · ') + ' …')

  const gente = ['Brasil', 'Argentina', 'França'].map((pais, i) => {
    const xi = bestXI(countryPool(pais), '4-3-3')
    return { uid: 'uid-' + i, nome: ['Diego', 'Dérick', 'Arruda'][i], pick: { pais, form: '4-3-3', xiKeys: xi.map(c => `${c.name}|${c.club}|${c.year}`) } }
  })
  const ficha = montaFicha(gente, 123456789, 1)
  p('times na ficha: ' + ficha.times.length + ' | de gente: ' + ficha.times.filter(t => t.uid).length)

  const resumo = (uid) => {
    const e = entrantesDaFicha(ficha, uid)
    const w = simulaCopaMundo(e, ficha.seed, ficha.edicao)
    const gols = w.groups.flatMap(g => g.matches.flat()).map(m => m.gh + '-' + m.ga).join(',')
    const ko = [...w.qf, ...w.sf].map(t => t.g1.join('') + t.g2.join('') + t.winner).join(',')
    return { txt: 'campeao=' + e[w.final.champion].club + '|final=' + e[w.final.h].club + ' ' + w.final.g[0] + 'x' + w.final.g[1] + ' ' + e[w.final.a].club, all: gols + '|' + ko + '|' + w.final.champion }
  }
  const a = resumo('uid-0'), b = resumo('uid-1'), c = resumo(undefined)
  p('')
  p('aparelho do Diego : ' + a.txt)
  p('aparelho do Dérick: ' + b.txt)
  p('aparelho de quem só assiste: ' + c.txt)
  p('')
  p('TODO MUNDO VÊ A MESMA COPA? ' + ((a.all === b.all && b.all === c.all) ? 'SIM' : 'NAO'))

  const eA = entrantesDaFicha(ficha, 'uid-0')
  p('quantos "você" no aparelho do Diego: ' + eA.filter(x => x.you).length + ' → ' + (eA.find(x => x.you) || {}).club + ' / ' + (eA.find(x => x.you) || {}).pais)
  p('e no de quem não escolheu: ' + entrantesDaFicha(ficha, 'uid-zzz').filter(x => x.you).length)

  const f2 = montaFicha(gente, 987654321, 2)
  const r2 = resumoDe(f2)
  function resumoDe(f) { const e = entrantesDaFicha(f, 'uid-0'); const w = simulaCopaMundo(e, f.seed, f.edicao); return e[w.final.champion].club }
  p('Copa NOVA (outra semente) dá outro campeão? ' + (r2 !== a.txt.split('|')[0].split('=')[1] ? 'SIM (' + r2 + ')' : 'nao, deu o mesmo (' + r2 + ')'))

  const semXi = ficha.times.filter(t => entrantesDaFicha(ficha)[ficha.times.indexOf(t)].xi.length !== 11)
  p('alguma seleção com time incompleto? ' + (semXi.length ? 'SIM — ' + semXi.map(t => t.pais).join(',') : 'nenhuma'))
  // ── 🌍 LIGA + COPA DO MUNDO: os 20 times da liga viram seleções + 4 da máquina
  const { montaFichaDaLiga } = await import('/src/escalacao/copa-mundo-online.tsx')
  const classificacao = Array.from({ length: 20 }, (_, i) => ({ id: i, nome: i < 3 ? ['Diego','Dérick FC','Arruda'][i] : 'Bot ' + (i - 2), humano: i < 3 }))
  const uidDe = new Map(classificacao.filter(c => c.humano).map(c => [c.id, 'u' + c.id])) // só gente tem linha em room_players
  const picksL = new Map([['u0', gente[0].pick], ['u1', gente[1].pick], ['u2', gente[2].pick]])
  const fl = montaFichaDaLiga(classificacao, uidDe, picksL, 42424242, 1)
  p('')
  p('liga+mundo · seleções na ficha: ' + fl.times.length)
  const nomesDaLiga = new Set(classificacao.map(c => c.nome))
  const daLiga = fl.times.filter(t => nomesDaLiga.has(t.nome)).length
  p('liga+mundo · times da liga na Copa: ' + daLiga + ' (esperado 20)')
  p('liga+mundo · seleções da máquina: ' + (fl.times.length - daLiga) + ' (esperado 4)')
  p('liga+mundo · gente com seleção própria: ' + fl.times.filter(t => t.uid).length + ' (esperado 3)')
  const paisesRepetidos = fl.times.length !== new Set(fl.times.map(t => t.pais)).size
  p('liga+mundo · país repetido? ' + (paisesRepetidos ? 'SIM' : 'nao'))
  p('liga+mundo · o 1º da liga levou o país que escolheu? ' + (fl.times[0].pais === gente[0].pick.pais && fl.times[0].nome === 'Diego' ? 'SIM' : 'NAO'))
  const eL = entrantesDaFicha(fl, 'u1')
  p('liga+mundo · quantos "você" no aparelho do 2º colocado: ' + eL.filter(x => x.you).length)
  const a2 = JSON.stringify(simulaCopaMundo(entrantesDaFicha(fl, 'u0'), fl.seed, fl.edicao).final)
  const b2 = JSON.stringify(simulaCopaMundo(entrantesDaFicha(fl, 'u2'), fl.seed, fl.edicao).final)
  p('liga+mundo · TODO MUNDO VÊ A MESMA COPA? ' + (a2 === b2 ? 'SIM' : 'NAO'))
  // ── ⏱️ os CASTIGOS do relógio: quem não convoca leva os PIORES 11
  const { piorXI } = await import('/src/escalacao/copa-mundo.tsx')
  const semTime = new Map([
    ['u0', { pais: 'Brasil', form: '4-3-3', xiKeys: [] }],            // escolheu bandeira, NÃO convocou
    ['u1', gente[1].pick],                                             // convocou normal
  ])
  const fp = montaFichaDaLiga(classificacao, uidDe, semTime, 7, 2)
  const eP = entrantesDaFicha(fp, 'u0')
  const meuTime = eP.find(x => x.you)
  const piores = piorXI(countryPool('Brasil'), '4-3-3')
  const bons = bestXI(countryPool('Brasil'), '4-3-3')
  const forcaPior = piores.reduce((s, c) => s + (c.lo + c.hi) / 2, 0) / 11
  const forcaBoa = bons.reduce((s, c) => s + (c.lo + c.hi) / 2, 0) / 11
  p('')
  p('castigo · quem nao convocou levou 11? ' + (meuTime && meuTime.xi.length === 11 ? 'SIM' : 'NAO'))
  p('castigo · e o time dele e o PIOR? ' + (meuTime && Math.abs(meuTime.str - forcaPior) < 0.01 ? 'SIM' : 'NAO') + ' (pior ' + forcaPior.toFixed(1) + ' x melhor ' + forcaBoa.toFixed(1) + ')')
  const semNada = montaFichaDaLiga(classificacao, uidDe, new Map(), 8, 3)
  // o bot leva a MELHOR que sobrou; a gente que dormiu leva a PIOR
  const ordem = paises
  const fb = montaFichaDaLiga(classificacao, uidDe, new Map([['u0', gente[0].pick]]), 9, 4)
  const paisDoBot = fb.times[3].pais            // 4º da tabela = 1º bot
  const paisDoDorminhoco = fb.times[1].pais     // 2º da tabela = gente que nao escolheu
  p('castigo · o BOT levou uma das melhores livres? ' + (ordem.indexOf(paisDoBot) <= 3 ? 'SIM (' + paisDoBot + ')' : 'NAO (' + paisDoBot + ')'))
  p('castigo · quem dormiu levou uma das PIORES? ' + (ordem.indexOf(paisDoDorminhoco) >= 20 ? 'SIM (' + paisDoDorminhoco + ')' : 'NAO (' + paisDoDorminhoco + ')'))
  p('castigo · ninguem escolheu bandeira: todos ficaram com pais? ' + (semNada.times.length === 24 && new Set(semNada.times.map(t => t.pais)).size === 24 ? 'SIM' : 'NAO'))
  // ── 🧩 castigo POR POSIÇÃO: quem marcou 7 fica com os 7 e leva 4 pernas-de-pau
  const { completaXI } = await import('/src/escalacao/copa-mundo.tsx')
  const meus7 = bestXI(countryPool('Brasil'), '4-3-3').slice(0, 7).map(c => `${c.name}|${c.club}|${c.year}`)
  const misto = completaXI('Brasil', '4-3-3', meus7)
  const chavesMisto = misto.map(c => `${c.name}|${c.club}|${c.year}`)
  const mantidos = meus7.filter(k => chavesMisto.includes(k)).length
  const nasVagas = (() => {
    const need = { GOL: 1, LAT: 2, ZAG: 2, MEI: 3, ATA: 3 }
    return Object.entries(need).every(([sec, n]) => misto.filter(c => c.sec === sec).length === n)
  })()
  p('')
  p('parcial · o time fechou com 11? ' + (misto.length === 11 ? 'SIM' : 'NAO (' + misto.length + ')'))
  p('parcial · manteve os 7 que a pessoa marcou? ' + (mantidos === 7 ? 'SIM' : 'NAO (' + mantidos + ')'))
  p('parcial · as posicoes bateram com a formacao? ' + (nasVagas ? 'SIM' : 'NAO'))
  // ── 🤖 BOT NÃO ROUBA A ESCOLHA DE GENTE (bug de 02/09: seis salas num dia).
  // Gente terminou ABAIXO de bots na tabela; o bot de cima pegava "a melhor
  // livre" (Brasil) antes da vez da pessoa, que caía na Coreia do Sul.
  const classAbaixo = Array.from({ length: 20 }, (_, i) => ({ id: i, nome: [5, 9, 15].includes(i) ? 'Gente ' + i : 'Bot ' + i, humano: [5, 9, 15].includes(i) }))
  const uidAbaixo = new Map(classAbaixo.filter(c => c.humano).map(c => [c.id, 'g' + c.id]))
  const picksAbaixo = new Map([['g5', gente[0].pick], ['g9', gente[1].pick], ['g15', gente[2].pick]]) // Brasil · Argentina · França
  const fr = montaFichaDaLiga(classAbaixo, uidAbaixo, picksAbaixo, 11, 5)
  const levou = (uid) => (fr.times.find(t => t.uid === uid) || {}).pais
  p('')
  p('roubo · gente abaixo dos bots levou o que escolheu? ' + ((levou('g5') === 'Brasil' && levou('g9') === 'Argentina' && levou('g15') === 'França') ? 'SIM' : 'NAO (' + [levou('g5'), levou('g9'), levou('g15')].join(',') + ')'))
  p('roubo · algum bot ficou com Brasil/Argentina/França? ' + (fr.times.some(t => !t.uid && ['Brasil', 'Argentina', 'França'].includes(t.pais)) ? 'SIM (ERRADO)' : 'nao'))
  p('roubo · país repetido? ' + (fr.times.length !== new Set(fr.times.map(t => t.pais)).size ? 'SIM' : 'nao'))
  p('FIM')
} catch (e) { p('ERRO: ' + (e && e.stack || e)) }
</script>
