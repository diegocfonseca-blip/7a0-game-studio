<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fundamentos do futebol — replay oficial</title><style>body{margin:0;background:#f4ecd6;color:#0c0c0c;font:16px system-ui}header{padding:12px}button,select{font:inherit;padding:9px;margin:4px;border:2px solid #0c0c0c;background:#ffc400;border-radius:8px}canvas{display:block;max-width:100%}#status,#case-note{padding:8px}</style><header><b>BANCADA DE AÇÕES · MESMO REPLAY OFICIAL 11×11</b><p>Modelo Civis preservado. Não escreve resultados ou dados da carreira.</p><select id="case"></select><button id="normal">Velocidade normal</button><button id="slow">Câmera lenta 0,5×</button><button id="pause">Pausar</button><div id="case-note"></div></header><div id="status">Carregando…</div><script type="module" src="./mechanics-audit.mjs"></script><script type="module">
await import('./mechanics-audit.mjs');
const cases=[['Disputa física',24.2,25.5,['Denis Law','Júnior Baiano'],'Volumes do corpo/cabeça; afastamento visual limitado.'],['Passe curto parado',.1,1.6,['Denis Law'],'Contato e orientação revisados.'],['Passe curto em movimento',24.2,25.5,['Danny McGrain'],'Captura adaptada de chute; revisão individual pendente.'],['Passe de primeira',1.7,2.4,['Arthur'],'Evento oficial; sequência rápida exige avaliação de transição.'],['Passe em profundidade',30.7,32.3,['Elano'],'Mesmo evento oficial de enfiada.'],['Domínio orientado',22.8,23.7,['Abedi Pelé'],'Antecipação/IK provisórios; sem captura específica de domínio.'],['Chute após condução',13.3,15.1,['Souza'],'Preparação/contato/continuação revisados.'],['Chute de primeira',39.1,41.5,['Denis Law'],'Caso do save; não certifica gesto específico de primeira.'],['Cruzamento e finalização',12,15.4,['Loco Abreu','Souza'],'O cruzamento não tem captura aprovada; lacuna explícita.']];
const select=document.querySelector('#case');cases.forEach((c,i)=>select.add(new Option(c[0],i)));let raf=0;function play(speed){cancelAnimationFrame(raf);const c=cases[+select.value],first=mechanicsAudit.seek(c[1]).frame,keys=first.players.filter(p=>c[3].includes(p.name)).map(p=>p.key);mechanicsAudit.focus(keys);mechanicsAudit.camera('close');document.querySelector('#case-note').textContent=c[4];const start=performance.now();function tick(now){const t=Math.min(c[2],c[1]+(now-start)/1000*speed);mechanicsAudit.seek(t,{draw:true});if(t<c[2])raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)}
document.querySelector('#normal').onclick=()=>play(1);document.querySelector('#slow').onclick=()=>play(.5);document.querySelector('#pause').onclick=()=>cancelAnimationFrame(raf);select.onchange=()=>play(.5);
</script></html>
