<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leilão Legends — replay cartoon 11×11</title><style>body{margin:0;background:#0c0c0c;color:#f4ecd6;font:15px system-ui}header{padding:12px}button,a{color:inherit}button{background:#1b7a3d;border:1px solid #f4ecd6;border-radius:6px;padding:8px;margin:4px}canvas{max-width:100%;height:auto;display:block;margin:auto}#status{padding:10px}</style><header><b>LEILÃO LEGENDS · REPLAY 3D 11×11 · TESTE LOCAL</b><div><button id="play">Assistir do início</button><button id="pause">Pausar</button><button id="wide">Campo completo</button><button id="follow">Acompanhar jogada</button></div></header><div id="status">Carregando os 22 jogadores…</div><script type="module" src="./mechanics-audit.mjs"></script><script type="module">
while(!window.mechanicsAudit&&!window.mechanicsAuditError)await new Promise(r=>setTimeout(r,50));if(window.mechanicsAudit){let running=false,start=0,seconds=0;mechanicsAudit.camera('match');mechanicsAudit.capture(0,null,{width:960,height:540});document.querySelector('#play').onclick=()=>{seconds=0;start=performance.now();running=true;tick()};document.querySelector('#pause').onclick=()=>{running=false};document.querySelector('#wide').onclick=()=>{mechanicsAudit.camera('tactical');mechanicsAudit.capture(seconds)};document.querySelector('#follow').onclick=()=>{mechanicsAudit.camera('match');mechanicsAudit.capture(seconds)};function tick(){if(!running)return;seconds=Math.min(94,(performance.now()-start)/1000);mechanicsAudit.seek(seconds,{draw:true});if(seconds<94)requestAnimationFrame(tick);else running=false}}
