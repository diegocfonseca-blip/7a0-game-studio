<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campo do mapa — teste local</title><style>body{margin:0;background:#f4ecd6;font:16px Arial}#root{height:100vh}#root>section{height:100%}</style><div id="root"></div><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import {flushSync} from 'react-dom';
import Complexo from '../../src/escalacao/presidencia-complexo-3d.tsx';
try{const f=await fetch('../../test-results/animation-library/neymarzetti-current/football-input.json').then(r=>r.json()),{input,sourceMatch}=f,roster=cs=>cs.map((p,i)=>({id:String(i),name:p.name,pos:p.pos,fake:p.fake}));

</script></html>
