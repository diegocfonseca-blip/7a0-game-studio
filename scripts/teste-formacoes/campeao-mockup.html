<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#0c100e;font-family:Arial,sans-serif}
.wrap{max-width:700px;margin:0 auto;padding:16px}
.c{position:relative;overflow:hidden;border:3px solid #FFC400;border-radius:18px;box-shadow:5px 5px 0 #000;background:radial-gradient(circle at 50% 30%,#2b4a2e 0%,#0f1f12 55%,#070b08 100%);padding:22px 16px 20px;text-align:center;color:#fff}
.rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg at 50% 45%,rgba(255,196,0,.13) 0 8deg,transparent 8deg 18deg);}
.kick{position:relative;display:inline-block;background:#0c0c0c;color:#FFC400;border:2px solid #FFC400;border-radius:999px;padding:3px 12px;font:900 12px Oswald;letter-spacing:.12em;text-transform:uppercase}
.t{position:relative;margin:10px 0 4px;font:900 54px/1 Oswald;text-transform:uppercase;letter-spacing:.02em;background:linear-gradient(100deg,#b8860b 0%,#FFC400 30%,#fff6c2 45%,#FFC400 60%,#b8860b 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(3px 3px 0 #000)}
.crest{position:relative;margin:14px auto 6px;width:120px;height:120px;border-radius:50%;background:#1b7a3d;border:5px solid #FFC400;box-shadow:0 0 0 4px #000,0 0 40px #ffc40099;display:grid;place-items:center;font:900 56px Oswald;color:#FFC400;transform:rotate(-6deg)}
.stamp{position:absolute;right:-26px;top:-12px;font-size:46px;transform:rotate(18deg)}
.nome{position:relative;font:900 34px Oswald;text-transform:uppercase;margin:8px 0 2px;text-shadow:3px 3px 0 #000}
.zoa{position:relative;display:inline-block;margin-top:6px;background:#FFC400;color:#0c0c0c;border:3px solid #000;border-radius:10px;padding:5px 14px;font:900 17px Oswald;text-transform:uppercase;box-shadow:3px 3px 0 #000;transform:rotate(-2deg)}
.row{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:18px;margin-top:18px}
.taca{font-size:78px;filter:drop-shadow(0 0 18px #ffc400aa)}
.stat{background:#fffaf0;color:#0c0c0c;border:3px solid #000;border-radius:12px;box-shadow:3px 3px 0 #000;padding:6px 12px;font:900 20px Oswald}
.stat small{display:block;font:800 10px Oswald;color:#666;letter-spacing:.06em;text-transform:uppercase}
.conf{position:absolute;width:8px;height:14px;border-radius:2px}
.leg{position:relative;font:700 11px Arial;color:rgba(255,255,255,.6);margin:14px 0 0}
@media(max-width:500px){.t{font-size:40px}.nome{font-size:26px}.crest{width:96px;height:96px;font-size:44px}}
</style></head><body><div class="wrap"><div class="c">
<div class="rays"></div>
<span class="conf" style="left:8%;top:12%;background:#FFC400;transform:rotate(30deg)"></span><span class="conf" style="left:85%;top:20%;background:#1B7A3D;transform:rotate(-20deg)"></span><span class="conf" style="left:72%;top:60%;background:#fff;transform:rotate(60deg)"></span><span class="conf" style="left:15%;top:70%;background:#E8503A;transform:rotate(10deg)"></span><span class="conf" style="left:50%;top:6%;background:#7C3AED;transform:rotate(45deg)"></span>
<span class="kick">🏆 Liga Legends · fim de papo</span>
<div class="t">É CAMPEÃO!</div>
<div class="crest">R<span class="stamp">🔨</span></div>
<div class="nome">Renoite FC</div>
<div class="zoa">👑 O rei da sala!</div>
<div class="row"><div class="stat"><small>Pontos</small>75</div><div class="taca">🏆</div><div class="stat"><small>Vitórias</small>24</div></div>
<p class="leg">Animação: o título entra com brilho dourado passando · o escudo cai carimbado com o martelo (som do martelo) · a frase de zoeira muda a cada campeão · a taça pulsa</p>
</div></div></body></html>
