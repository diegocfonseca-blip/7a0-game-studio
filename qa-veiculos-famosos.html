<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carros famosos 3D</title><style>
body{margin:0;background:#f4ecd6;color:#0c0c0c;font:14px system-ui}#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}@media(max-width:600px){#grid{grid-template-columns:repeat(2,1fr)}}
figure{margin:0;border:3px solid #0c0c0c;border-radius:12px;overflow:hidden;background:#fff;box-shadow:3px 3px 0 #000}canvas{display:block;width:100%;aspect-ratio:4/3}figcaption{font:800 15px Oswald,system-ui;text-transform:uppercase;padding:4px 8px;border-top:3px solid #0c0c0c}
</style></head><body><div id="grid"></div><script type="module">
// Folha de revisão local dos 6 carros do pátio da Vadico (QA, sem compra/loja/save).
import * as T from 'three';import {criarBibliotecaVeiculos} from './src/escalacao/veiculos-modelos-3d.ts';
const q=new URLSearchParams(location.search),ids=(q.get('ids')??'fusca,brasilia,gol-gti,kombi,opala-ss,f40').split(','),view=q.get('view')??'34';
const names={fusca:'Fusca',brasilia:'Brasília','gol-gti':'Gol GTI',kombi:'Kombi','opala-ss':'Opala SS',f40:'Ferrari F40'};
const lib=criarBibliotecaVeiculos(),grid=document.getElementById('grid');
if(q.has('patio')){ // ?patio=1 · o pátio da Vadico de perto (só a loja, câmera baixa)
 const {criarConcessionariaComplexo}=await import('./src/escalacao/presidencia-complexo-concessionaria.ts');
 grid.style.display='block';const cv=document.createElement('canvas');cv.style.cssText='width:100%;height:calc(100vh - 16px);aspect-ratio:auto';grid.append(cv);
 const r=new T.WebGLRenderer({canvas:cv,antialias:true});r.setPixelRatio(devicePixelRatio);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.1;
 const s=new T.Scene();s.background=new T.Color('#cfe3ec');s.add(new T.HemisphereLight('#ecf4ff','#9a8764',2.1));const sun=new T.DirectionalLight('#fff4da',3);sun.position.set(8,15,12);s.add(sun);
 const g=new T.Mesh(new T.PlaneGeometry(400,400),new T.MeshStandardMaterial({color:'#7c9a5a',roughness:1}));g.rotation.x=-Math.PI/2;g.position.y=-.05;s.add(g);
 const shop=criarConcessionariaComplexo(s);s.updateMatrixWorld(true);const cars=shop.root.children.filter(o=>o.name.startsWith('vadico-patio-')).map(o=>o.getWorldPosition(new T.Vector3())),cx=cars.reduce((a,c)=>a+c.x,0)/cars.length,cz=cars[0].z,y=cars[0].y;
 const wide=cv.clientWidth>cv.clientHeight,c=new T.PerspectiveCamera(wide?40:50,1,.1,500);g.position.y=y-.05;if(wide){c.position.set(cx,y+8.5,cz+29);c.lookAt(cx,y+.4,cz-.5)}else{const m=q.get('metade')==='b'?1:-1;c.position.set(cx+m*9.8,y+8,cz+27);c.lookAt(cx+m*9.8,y+.2,cz-.3)} // celular: metade a (Fusca/Brasília/Gol) ou b (Kombi/Opala/F40)
 const resize=()=>{r.setSize(cv.clientWidth,cv.clientHeight,false);c.aspect=cv.clientWidth/cv.clientHeight;c.updateProjectionMatrix();r.render(s,c)};resize();setTimeout(resize,1500);addEventListener('resize',resize);
}else for(const id of ids){const fig=document.createElement('figure'),cv=document.createElement('canvas'),cap=document.createElement('figcaption');cap.textContent=names[id]??id;fig.append(cv,cap);grid.append(fig);
 const r=new T.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(devicePixelRatio);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.1;
 const s=new T.Scene();s.background=new T.Color('#e9e2cc');const m=lib.create(id);m.update(Number(q.get('dist')??0),Number(q.get('steer')??0));s.add(m.root);
 s.add(new T.HemisphereLight('#ecf4ff','#9a8764',2.1));const sun=new T.DirectionalLight('#fff4da',3);sun.position.set(8,15,12);s.add(sun);const fill=new T.DirectionalLight('#ffffff',1.2);fill.position.set(-8,6,-6);s.add(fill);
 const fl=new T.Mesh(new T.PlaneGeometry(40,40),new T.MeshStandardMaterial({color:'#d9d2bb',roughness:1}));fl.rotation.x=-Math.PI/2;fl.position.y=-.01;s.add(fl);
 const p=m.profile,d=p.length*1.45,c=new T.PerspectiveCamera(32,4/3,.05,100);
 const pos={'34':[d*.72,d*.32,d*.8],side:[d*1.15,p.height*.5,0],front:[0,p.height*.6,d*1.1],rear:[0,p.height*.7,-d*1.1],'34r':[d*.72,d*.35,-d*.8],top:[0.01,d*1.3,0]}[view];c.position.set(...pos);c.lookAt(0,p.height*.42,0);
 const resize=()=>{r.setSize(cv.clientWidth,cv.clientHeight,false);c.aspect=cv.clientWidth/cv.clientHeight;c.updateProjectionMatrix();r.render(s,c)};resize();addEventListener('resize',resize)}
window.qaPronto=true;
</script></body></html>
